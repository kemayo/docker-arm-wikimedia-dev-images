name: Shellcheck

on:
  pull_request:
    paths:
      - "*.sh"
      - ".github/workflows/shellcheck.yml"
  push:
    branches:
      - main
    paths:
      - "*.sh"
      - ".github/workflows/shellcheck.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the shell scripts
        shell: bash
        run: |
          set -euo pipefail

          # Only the scripts of this repository. The scripts in files/ are
          # copies of upstream files. A local change to them makes drift.
          mapfile -t scripts < <(git ls-files "*.sh" | grep -v "^files/")

          # Warning level and higher only. The style and info rules report
          # mostly quoting habits, which would hide the real faults.
          shellcheck --severity=warning "${scripts[@]}"
