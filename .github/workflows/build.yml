name: Build Images

on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "files/**"
      - "build.sh"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  push:
    branches:
      - main
    paths:
      - "**/Dockerfile"
      - "files/**"
      - "build.sh"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-images:
    # Arm runner, because build.sh makes the "-arm1" images. An x86 runner
    # would make amd64 images and test nothing.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build all images
        run: ./build.sh
